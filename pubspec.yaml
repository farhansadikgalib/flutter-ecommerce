name: ousadbazar
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  get:
  dio:
  flutter_easyloading:
  flutter_screenutil:
  google_fonts:
  logger:
  connectivity_plus: ^4.0.2
  url_launcher:
  shared_value:
  intl:
  any_image_view: ^1.6.0
  easy_debounce:
  font_awesome_flutter:
  flutter_spinkit:
  skeletonizer: ^2.0.1
  dropdown_search:
  carousel_slider:
  carousel_indicator:
  flutter_staggered_animations:
  dynamic_height_grid_view:
  persistent_bottom_nav_bar:
  flutter_gallery_3d:
  badges:
  flutter_rating_bar:
  animations:
  pinput:
  timeline_tile:
  flutter_dotenv:
  flutter_linkify:
  firebase_core:
  firebase_crashlytics:
  firebase_messaging:
  cloud_firestore:



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.2
  android_notification_icons:

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/png/
    - assets/logo/

icons_launcher:
  image_path: "assets/logo/icon.png"
  platforms:
    android:
      enable: true
      image_path: "assets/logo/icon.png"
      notification_image: "assets/logo/icon.png"
      # adaptive_background_color: '#ffffff'
      adaptive_background_image: "assets/logo/icon.png"
      adaptive_foreground_image: "assets/logo/icon.png"
      adaptive_round_image: "assets/logo/icon.png"
      adaptive_monochrome_image: "assets/logo/icon.png"
    ios:
      enable: true
      image_path: "assets/logo/icon.png"
      dark_path: "assets/logo/icon.png"
      tinted_path: "assets/logo/icon.png"

android_notification_icons:
  image_path: 'assets/png/logo.png'
  icon_name: 'ic_notification'